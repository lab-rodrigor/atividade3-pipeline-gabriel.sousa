name: deploy

# O pipeline faz o que você fez à mão na atividade 2. A cada push na main, ele
# derruba a topologia e sobe de novo, do zero.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  SLUG: gabriel-sousa
  PORTA: 23070

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar a chave de deploy
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -H gr.lab.ayty.org >> ~/.ssh/known_hosts

      - name: Derrubar a topologia antiga
        run: |
          gr() { ssh -i ~/.ssh/deploy "gr-${SLUG}@gr.lab.ayty.org" gr-docker "$@"; }

          gr stop front || true
          gr rm front || true
          gr stop api || true
          gr rm api || true
          gr stop banco || true
          gr rm banco || true

      - name: Criar rede e volume
        run: |
          gr() { ssh -i ~/.ssh/deploy "gr-${SLUG}@gr.lab.ayty.org" gr-docker "$@"; }

          gr network create web || true
          gr network create dados --interna || true
          gr volume create pgdata || true

      - name: Subir banco, API e front
        run: |
          gr() { ssh -i ~/.ssh/deploy "gr-${SLUG}@gr.lab.ayty.org" gr-docker "$@"; }

          gr run -d --name banco \
            --network dados \
            -v pgdata:/var/lib/postgresql/data \
            -e POSTGRES_PASSWORD="${{ secrets.DB_SENHA }}" \
            -e POSTGRES_DB=pokedex \
            postgres:17-alpine

          gr run -d --name api \
            --network dados \
            -e POSTGRES_HOST="gr-${SLUG}-banco" \
            -e POSTGRES_DB=pokedex \
            -e POSTGRES_PASSWORD="${{ secrets.DB_SENHA }}" \
            gr-atv2-api:1

          gr network connect web api

          gr run -d --name front \
            --network web \
            -p "${PORTA}:80" \
            -e API="gr-${SLUG}-api" \
            -e DEPLOY_SHA="${{ github.sha }}" \
            gr-atv2-front:1

      - name: Conferir que subiu
        run: |
          URL="http://gr.lab.ayty.org:${PORTA}/api/pokemons"

          for i in $(seq 1 30); do
            if curl -sf "$URL" > /dev/null; then
              echo "Listagem respondeu em $URL"
              exit 0
            fi
            echo "Tentativa $i: ainda sem resposta, aguardando..."
            sleep 2
          done

          echo "Listagem não respondeu a tempo"
          exit 1
